  <circle cx="380" cy="136" r="13" fill="#334155"/>
  <circle cx="385" cy="131" r="12" fill="#f1f5f9"/>
  <circle cx="418" cy="136" r="10" fill="#334155"/>
  <circle cx="422" cy="131" r="9" fill="#f1f5f9"/>

  <!-- Cửa kính -->
